# Set the terminal to 256 colour
set -g default-terminal "tmux-256color"
# Reduce escape-time so OSC responses are consumed before printing to screen
set -sg escape-time 10
# Tell tmux to start indexing at 1 instead of 0
set -g base-index 1
# Set history scrollback to 50000
set -g history-limit 50000
# split window vertical
bind _ split-window -v
# split window horizontal
bind | split-window -h
# vi-style controls for copy mode
setw -g mode-keys vi
# list all paste buffers
bind-key b list-buffers
# delete the most recently copied buffer of test
bind-key x delete-buffer
# Reload mapped to r
bind r source ~/.tmux.conf\; display "~/.tmux.conf reloaded!"
# Test key binding for create window and then for naming
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"
# Remove prompt for kill window
bind-key & kill-window
# Pane movement like vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Colour scheme (status: #000000, accents: #00afaf)
set -g status-style                 "bg=#000000,fg=#ffffff"
set -g status-left-style            "bg=#000000,fg=#ff8700"
set -g status-left                  "#[fg=#ff8700][#S] "
set -g status-right-style           "bg=#000000,fg=#ffffff"
set -g window-status-style          "bg=#000000,fg=#ff8700"
set -g window-status-current-style  "bg=#000000,fg=#ff8700"
set -g window-status-current-format "#[nobold]#I:#W#F"

# Status line layout: window list left | CPU/RAM centre | time right
set -g status-interval 5
set -g status-format[0] "#[align=left,fg=#ff8700]#{W:#{E:window-status-format} ,#{E:window-status-current-format} }#[align=centre,fg=#ff8700] 5min loadavg #(awk '{print $2}' /proc/loadavg) | RAM #(free | awk '/^Mem/{printf \"%.0f%%\", $3/$2*100}') #[align=right,fg=#ff8700] %H:%M %d-%b-%y "
set -g pane-border-lines            single
set -g pane-border-style            "fg=#121212"
set -g pane-active-border-style     "fg=#121212"
set -g window-style                 "bg=#121212"
set -g window-active-style          "bg=#000000"
set -g message-style                "bg=#000000,fg=#00afaf"

# TPM - Tmux Plugin Manager
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Plugin: tmux-logging (prefix + shift-p to toggle, prefix + alt-p to save history)
set -g @plugin 'tmux-plugins/tmux-logging'

# Plugin: tmux-cowboy (prefix + ctrl-f to kill runaway process in pane)
set -g @plugin 'tmux-plugins/tmux-cowboy'

# Plugin: tmux-resurrect (prefix + ctrl-s to save, prefix + ctrl-r to restore)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep this line at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
